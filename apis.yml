aid: jump
name: Jump
description: Jump is a unified fan experience and ticketing platform built exclusively for professional
  sports teams. It combines primary and resale ticketing, team-branded mobile apps and websites, marketing
  and messaging, loyalty, fan identity and wallet, point-of-sale and scanning, dynamic pricing, and a
  unified fan-data foundation into a single system that teams own and control. Jump also embeds agentic
  AI agents to automate pricing, inventory, and revenue operations. It serves teams across the NBA, MLB,
  WNBA, NWSL, USL, and NCAA and is backed by Battery Ventures, Forerunner Ventures, Index Ventures, and
  Menlo Ventures. Jump connects to the tools teams already use through integration APIs, but publishes
  no public developer portal, OpenAPI, or self-serve API documentation.
